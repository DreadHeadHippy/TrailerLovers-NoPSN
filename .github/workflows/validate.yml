name: Validate Theme

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate theme structure
      run: |
        Write-Host "Validating TrailerLovers-NoPSN theme structure..."
        
        $requiredFiles = @(
          "theme.yaml",
          "Constants.xaml",
          "README.md"
        )
        
        $requiredDirs = @(
          "Views",
          "DefaultControls",
          "DerivedStyles",
          "CustomControls"
        )
        
        $errors = @()
        
        # Check required files
        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            $errors += "Missing required file: $file"
          } else {
            Write-Host "✓ Found: $file"
          }
        }
        
        # Check required directories
        foreach ($dir in $requiredDirs) {
          if (-not (Test-Path $dir -PathType Container)) {
            $errors += "Missing required directory: $dir"
          } else {
            Write-Host "✓ Found directory: $dir"
          }
        }
        
        # Validate theme.yaml content
        if (Test-Path "theme.yaml") {
          $themeContent = Get-Content "theme.yaml" -Raw
          if ($themeContent -notmatch "Mode:\s*Fullscreen") {
            $errors += "theme.yaml must specify Mode: Fullscreen"
          }
          if ($themeContent -notmatch "ThemeApiVersion:") {
            $errors += "theme.yaml must specify ThemeApiVersion"
          }
          if ($themeContent -match "ThemeApiVersion:\s*([0-9\.]+)") {
            $apiVersion = $matches[1]
            Write-Host "✓ Theme API Version: $apiVersion"
          }
        }
        
        # Check for screenshots
        $screenshots = Get-ChildItem -Path "." -Name "Screenshot*.png", "screenshot*.png"
        if ($screenshots.Count -eq 0) {
          Write-Warning "No screenshots found - consider adding Screenshot-*.png files"
        } else {
          Write-Host "✓ Found $($screenshots.Count) screenshot(s)"
        }
        
        # Report results
        if ($errors.Count -gt 0) {
          Write-Host "`nValidation failed with errors:" -ForegroundColor Red
          foreach ($error in $errors) {
            Write-Host "❌ $error" -ForegroundColor Red
          }
          exit 1
        } else {
          Write-Host "`n✅ Theme validation passed!" -ForegroundColor Green
        }
      shell: pwsh
      
    - name: Check XAML syntax
      run: |
        Write-Host "Checking XAML files for syntax errors..."
        
        $xamlFiles = Get-ChildItem -Path "." -Filter "*.xaml" -Recurse
        $errors = @()
        
        foreach ($file in $xamlFiles) {
          try {
            [xml]$xmlContent = Get-Content $file.FullName -Raw
            Write-Host "✓ Valid XAML: $($file.Name)"
          } catch {
            $errors += "Invalid XAML in $($file.Name): $($_.Exception.Message)"
          }
        }
        
        if ($errors.Count -gt 0) {
          Write-Host "`nXAML validation failed:" -ForegroundColor Red
          foreach ($error in $errors) {
            Write-Host "❌ $error" -ForegroundColor Red
          }
          exit 1
        } else {
          Write-Host "`n✅ All XAML files are valid!" -ForegroundColor Green
        }
      shell: pwsh