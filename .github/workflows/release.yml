name: Create Release

on:
  push:
    tags:
      - 'release*'  # Triggered on tags like 'release', 'release-2', etc.
  workflow_dispatch:  # Allow manual trigger

jobs:
  create-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set release info
      id: release_info
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd"
        $shortCommit = "${{ github.sha }}".Substring(0, 7)
        $tag = "${{ github.ref_name }}"
        
        echo "TIMESTAMP=$timestamp" >> $env:GITHUB_OUTPUT
        echo "SHORT_COMMIT=$shortCommit" >> $env:GITHUB_OUTPUT
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        
        Write-Host "Tag: $tag"
        Write-Host "Timestamp: $timestamp" 
        Write-Host "Commit: $shortCommit"
      shell: pwsh
      
    - name: Create theme package
      run: |
        $timestamp = "${{ steps.release_info.outputs.TIMESTAMP }}"
        $commit = "${{ steps.release_info.outputs.SHORT_COMMIT }}"
        $packageName = "TrailerLovers-NoPSN-$timestamp-$commit"
        
        # Create temporary directory for packaging
        $tempDir = New-Item -ItemType Directory -Path "temp-package" -Force
        
        # Copy all theme files except unnecessary ones
        $excludePatterns = @(
          ".git*",
          "*.md",
          "LICENSE",
          "temp-*",
          "scripts",
          ".github"
        )
        
        Get-ChildItem -Path "." | Where-Object { 
          $item = $_
          -not ($excludePatterns | Where-Object { $item.Name -like $_ })
        } | Copy-Item -Destination $tempDir.FullName -Recurse -Force
        
        # Create .pthm file (which is just a zip with .pthm extension)
        $packagePath = "$packageName.pthm"
        Compress-Archive -Path "$($tempDir.FullName)\*" -DestinationPath $packagePath -Force
        
        # Clean up temp directory
        Remove-Item $tempDir.FullName -Recurse -Force
        
        Write-Host "Created package: $packagePath"
        echo "PACKAGE_PATH=$packagePath" >> $env:GITHUB_ENV
      shell: pwsh
      
    - name: Generate release notes
      run: |
        $timestamp = "${{ steps.release_info.outputs.TIMESTAMP }}"
        $commit = "${{ steps.release_info.outputs.SHORT_COMMIT }}"
        $tag = "${{ steps.release_info.outputs.TAG }}"
        
        $releaseNotes = @"
## TrailerLovers-NoPSN ($tag)

**Modified Playnite theme based on the original TrailerLovers theme**

**Build Date**: $timestamp  
**Commit**: $commit

### 🎮 Installation

**Quick Install:**
1. Download the `.pthm` file below
2. Double-click to install automatically in Playnite
3. Activate in Playnite Settings → Theme

### 📋 Requirements
- Playnite 9.0+
- Recommended resolution: 1920x1080 or 3440x1440

### 🔌 Recommended Extensions
- ExtraMetadataLoader
- ExtraMetadataLoader Fullscreen Helper  
- How Long To Beat
- SuccessStory

### 📚 Documentation
- [Installation Guide](https://github.com/DreadHeadHippy/TrailerLovers-NoPSN/blob/main/INSTALL.md)

---

*This is a modified version of the original TrailerLovers theme by blooderscrew*
"@
        
        # Write to file for use in release
        Set-Content "release-notes.txt" -Value $releaseNotes
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.release_info.outputs.TAG }}
        name: "TrailerLovers-NoPSN (${{ steps.release_info.outputs.TIMESTAMP }})"
        body_path: release-notes.txt
        files: |
          ${{ env.PACKAGE_PATH }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}