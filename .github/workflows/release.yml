name: Create Release

on:
  push:
    tags:
      - 'v*'  # Triggered on version tags like v1.0.3
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version number (e.g., 1.0.3)'
        required: true
        default: '1.0.3'

jobs:
  create-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}" -replace '^v', ''
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG=v$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
      
    - name: Update version in files
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        
        # Update theme.yaml
        $themeContent = Get-Content "theme.yaml" -Raw
        $themeContent = $themeContent -replace "Version: [\d\.]+", "Version: $version"
        Set-Content "theme.yaml" -Value $themeContent -NoNewline
        
        # Update InstallerManifest.yaml
        $manifestContent = Get-Content "InstallerManifest.yaml" -Raw
        $today = Get-Date -Format "yyyy-MM-dd"
        $manifestContent = $manifestContent -replace "ReleaseDate: \d{4}-\d{2}-\d{2}", "ReleaseDate: $today"
        $manifestContent = $manifestContent -replace "Version: [\d\.]+", "Version: $version"
        Set-Content "InstallerManifest.yaml" -Value $manifestContent -NoNewline
        
        Write-Host "Updated version to $version"
      shell: pwsh
      
    - name: Create theme package
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $packageName = "TrailerLovers-NoPSN-v$version"
        
        # Create temporary directory for packaging
        $tempDir = New-Item -ItemType Directory -Path "temp-package" -Force
        
        # Copy all theme files except unnecessary ones
        $excludePatterns = @(
          ".git*",
          "*.md",
          "LICENSE",
          "temp-*",
          "scripts",
          ".github"
        )
        
        Get-ChildItem -Path "." | Where-Object { 
          $item = $_
          -not ($excludePatterns | Where-Object { $item.Name -like $_ })
        } | Copy-Item -Destination $tempDir.FullName -Recurse -Force
        
        # Create .pthm file (which is just a zip with .pthm extension)
        $packagePath = "$packageName.pthm"
        Compress-Archive -Path "$($tempDir.FullName)\*" -DestinationPath $packagePath -Force
        
        # Clean up temp directory
        Remove-Item $tempDir.FullName -Recurse -Force
        
        Write-Host "Created package: $packagePath"
        echo "PACKAGE_PATH=$packagePath" >> $env:GITHUB_ENV
      shell: pwsh
      
    - name: Generate release notes
      id: release_notes
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        
        $releaseNotes = @"
        ## TrailerLovers-NoPSN v$version
        
        ### 🎮 Installation
        
        **Quick Install:**
        1. Download the \`.pthm\` file below
        2. Double-click to install automatically in Playnite
        3. Activate in Playnite Settings → Theme
        
        **Manual Install:**
        1. Download and extract the source code
        2. Copy to \`%AppData%\Playnite\Themes\Fullscreen\TrailerLovers-Personal\`
        3. Restart Playnite and select the theme
        
        ### 📋 Requirements
        - Playnite 9.0+
        - Recommended resolution: 1920x1080 or 3440x1440
        
        ### 🔌 Recommended Extensions
        - ExtraMetadataLoader
        - ExtraMetadataLoader Fullscreen Helper  
        - How Long To Beat
        - SuccessStory
        
        ### 📚 Documentation
        - [Installation Guide](https://github.com/DreadHeadHippy/TrailerLovers-NoPSN/blob/main/INSTALL.md)
        - [Changelog](https://github.com/DreadHeadHippy/TrailerLovers-NoPSN/blob/main/CHANGELOG.md)
        
        ---
        
        **Full Changelog**: https://github.com/DreadHeadHippy/TrailerLovers-NoPSN/compare/v$((([version]$version).Build -eq 1) ? "$($version.Split('.')[0]).$($version.Split('.')[1]).$([int]$version.Split('.')[2] - 1)" : "v$($version.Split('.')[0]).$($version.Split('.')[1]).$([int]$version.Split('.')[2] - 1)")...v$version
        "@
        
        # Write to file for use in release
        Set-Content "release-notes.txt" -Value $releaseNotes
        echo "RELEASE_NOTES_FILE=release-notes.txt" >> $env:GITHUB_ENV
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: "TrailerLovers-NoPSN v${{ steps.version.outputs.VERSION }}"
        body_path: release-notes.txt
        files: |
          ${{ env.PACKAGE_PATH }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}